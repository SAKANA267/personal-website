<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 站点图标：SAKANA（鱼）线稿；路径以 / 开头，Vite 会按 base（生产 /web/）自动改写 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="SAKANA 的个人网站：在线聊天与屏幕转播、自定义题库、开发日志、博客、二维码文件分享。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Web learning" />
    <meta
      property="og:description"
      content="SAKANA 的个人网站：在线聊天与屏幕转播、自定义题库、开发日志、博客、二维码文件分享。"
    />
    <title>Web learning</title>
    <!-- 移动端浏览器 chrome 底色随主题；由下方内联脚本与 stores/theme.ts 共同维护 -->
    <meta name="theme-color" content="#fafafa" />
    <script>
      // 主题防闪烁：首帧前按「localStorage 显式选择 > 系统偏好」给 <html> 挂 dark 类。
      // 逻辑须与 client/src/stores/theme.ts 保持一致（dark 类 + 两处取值优先级）。
      ;(function () {
        try {
          var saved = localStorage.getItem('theme')
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document
              .querySelector('meta[name="theme-color"]')
              ?.setAttribute('content', '#121314')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
