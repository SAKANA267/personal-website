<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mono — Dumbbell Queue · 改版前后首屏耗时</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F0EFEB;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);padding:40px;-webkit-font-smoothing:antialiased}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:760px;margin:0 auto}
  .card{background:var(--bg);border-radius:24px;padding:28px 28px 20px}
  .card.wide{grid-column:1/-1}
  h2{font-weight:700;font-size:16.5px;letter-spacing:-.02em;margin-bottom:3px}
  .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px}
  .src{font-size:9.5px;color:var(--faint);margin-top:10px;letter-spacing:.08em;font-weight:500}
  svg{width:100%;max-height:330px;display:block;margin:0 auto}
  svg text{font-family:'Inter',sans-serif}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1.3) both}
  @keyframes pop{from{transform:scale(0)}to{transform:none}}
  .fade{animation:fade .9s ease both}
  @keyframes fade{from{opacity:0}}
  @media (prefers-reduced-motion:reduce){
    .pop,.fade{animation:none}
  }
</style>
</head>
<body>
<div class="grid2">
  <div class="card wide">
    <h2>Vue 化改版之后，每个页面都快了</h2>
    <div class="sub">空心点 = 改版前 · 实心点 = 改版后 · 1 珠 = 省下的 100ms · 单位：百毫秒（演示）</div>
    <svg id="ch" viewBox="0 0 400 320" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="src">DUMBBELL QUEUE · MONO-BASIC · 性能对比 · 演示数据</div>
  </div>
</div>
<script>
// ── shared Mono tokens（与 basics-gallery 同源） ──
const INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',GRID='#DEDDD6';
const NS='http://www.w3.org/2000/svg';
const el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};
const txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};
const tip=(n,s)=>{const t=document.createElementNS(NS,'title');t.textContent=s;n.appendChild(t)};
const rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000;
const obsReveal=(id,fn)=>{
  const n=document.getElementById(id);
  const go=()=>{n.innerHTML='';fn(n)};
  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){go();io.disconnect()}},{threshold:.3});
  io.observe(n);
  n.style.cursor='pointer';
  n.addEventListener('click',go);
  // 兜底：个别嵌入式 webview 不派发 iframe 内的 IntersectionObserver 回调
  // （spec 要求初次 observe 必回调；探针 500ms 内无回调即视为该环境 IO 失效，直接渲染）
  let ioWorks=false;
  const probe=new IntersectionObserver(()=>{ioWorks=true;probe.disconnect()},{threshold:0});
  probe.observe(document.body);
  setTimeout(()=>{if(!ioWorks&&!n.children.length){io.disconnect();go()}},500);
};

// ── 数据（用户只需要改这里；值 = 百毫秒） ──
const D=[['首页',14,6],['博客',19,9],['题库',26,13],['聊天',31,21],['登录',38,30]];

// ── 渲染（骨架来自 basics-gallery「C8 · dumbbell queue」卡） ──
obsReveal('ch',s=>{
  const y0=i=>56+i*46,X0=118,X1=364,mapX=v=>X0+(v-4)/36*(X1-X0);
  D.forEach(([name,was,now],i)=>{
    const y=y0(i),xa=mapX(was),xb=mapX(now);
    txt(s,{x:108,y:y+3,'font-size':7.5,'font-weight':700,fill:'#6A6963','text-anchor':'end',
      'letter-spacing':'.06em',class:'fade',style:`animation-delay:${i*.08}s`},name);
    el(s,'line',{x1:X0-6,y1:y,x2:X1+6,y2:y,stroke:'#E3E2DB','stroke-width':.7,
      class:'fade',style:`animation-delay:${i*.08}s`});
    // beads: one per 100ms saved, strung between the two dots
    const n=was-now;
    for(let k=0;k<n;k++){
      const t=(k+.5)/n,x=xb+t*(xa-xb),yy=y+(rnd(k+1,i+3)-.5)*2.6;
      el(s,'circle',{cx:x,cy:yy,r:1.5+rnd(k+2,i+4)*.9,fill:'#8F8E88',opacity:.85,
        class:'pop',style:`animation-delay:${.3+i*.08+k*.03}s`});
    }
    el(s,'circle',{cx:xa,cy:y,r:4.2,fill:PAPER,stroke:INK,'stroke-width':1.3,
      class:'pop',style:`animation-delay:${.2+i*.08}s`});
    const after=el(s,'circle',{cx:xb,cy:y,r:4.6,fill:INK,
      class:'pop',style:`animation-delay:${.6+i*.08}s`});
    tip(after,`${name} — ${was*100}ms → ${now*100}ms`);
    txt(s,{x:xa+10,y:y-8,'font-size':8.5,'font-weight':700,fill:'#B0AFA9',
      class:'fade',style:`animation-delay:${.3+i*.08}s`},was);
    txt(s,{x:xb-10,y:y-8,'font-size':10,'font-weight':800,fill:INK,'text-anchor':'end',
      class:'fade',style:`animation-delay:${.7+i*.08}s`},now);
  });
  txt(s,{x:X0,y:290,'font-size':7,'font-weight':600,fill:'#C6C5BF',class:'fade'},'更快 ←');
  txt(s,{x:X1,y:290,'font-size':7,'font-weight':600,fill:'#C6C5BF','text-anchor':'end',
    class:'fade'},'百毫秒');
  txt(s,{x:200,y:308,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',
    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1s'},
    '1 珠 = 省下的 100ms · 空心 = 改版前 · 实心 = 改版后');
});
</script>
</body>
</html>
