<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mono — Dot Waffle · 访客来源构成（三秒版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F0EFEB;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);padding:40px;-webkit-font-smoothing:antialiased}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:760px;margin:0 auto}
  .card{background:var(--bg);border-radius:24px;padding:28px 28px 20px}
  .card.wide{grid-column:1/-1}
  h2{font-weight:700;font-size:16.5px;letter-spacing:-.02em;margin-bottom:3px}
  .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px}
  .src{font-size:9.5px;color:var(--faint);margin-top:10px;letter-spacing:.08em;font-weight:500}
  svg{width:100%;max-height:320px;display:block;margin:0 auto}
  svg text{font-family:'Inter',sans-serif}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1.3) both}
  @keyframes pop{from{transform:scale(0)}to{transform:none}}
  .fade{animation:fade .9s ease both}
  @keyframes fade{from{opacity:0}}
  @media (prefers-reduced-motion:reduce){
    .pop,.fade{animation:none}
  }
</style>
</head>
<body>
<div class="grid2">
  <div class="card wide">
    <h2>同一份来源数据，三秒版</h2>
    <div class="sub">每 1 点 = 1% 的访客 · 十乘十的方阵 · 与「Tick Donut」同源的姊妹图</div>
    <svg id="ch" viewBox="0 0 380 300" width="100%" style="max-height:320px"></svg>
    <div class="src">DOT WAFFLE · MONO-GLANCE · 访客来源 · 演示数据</div>
  </div>
</div>
<script>
// ── shared Mono tokens（与 glance-gallery 同源） ──
const INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',GRID='#DEDDD6';
const LAD=['#1C1C1A','#4A4944','#8F8E88','#B0AFA9','#D8D7D1'];
const rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000;
const obsReveal=(id,fn)=>{
  const el=document.getElementById(id);
  const go=()=>fn(el);
  const io=new IntersectionObserver(es=>{
    if(es[0].isIntersecting){go();io.disconnect()}
  },{threshold:.35});
  io.observe(el);
  el.style.cursor='pointer';
  el.addEventListener('click',go);
  // 兜底：个别嵌入式 webview 不派发 iframe 内的 IntersectionObserver 回调
  // （spec 要求初次 observe 必回调；探针 500ms 内无回调即视为该环境 IO 失效，直接渲染）
  let ioWorks=false;
  const probe=new IntersectionObserver(()=>{ioWorks=true;probe.disconnect()},{threshold:0});
  probe.observe(document.body);
  setTimeout(()=>{if(!ioWorks&&!el.children.length){io.disconnect();go()}},500);
};

// ── 数据（与 tick-donut.html 同一份构成，作姊妹对照） ──
const D=[['直达',37],['搜索',28],['友链',21],['社交',14]];

// ── 渲染（骨架来自 glance-gallery「mono-redesign · donut → waffle of dots」卡） ──
(()=>{
const NS='http://www.w3.org/2000/svg';
const mkEl=(svg,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);svg.appendChild(n);return n};
obsReveal('ch',s=>{
  s.innerHTML='';
  const COLS=10,CELL=21,R=7.5,X0=8,Y0=10;
  let idx=0;
  D.forEach(([name,v],g)=>{
    for(let k=0;k<v;k++){
      const c=idx+k,row=Math.floor(c/COLS),col=c%COLS;
      mkEl(s,'circle',{cx:X0+col*CELL+R,cy:Y0+row*CELL+R,r:R,fill:LAD[g],
        class:'pop',style:`animation-delay:${c*.008+g*.05}s`});
    }
    idx+=v;
  });
  D.forEach(([name,v],g)=>{
    const y=26+g*40;
    mkEl(s,'circle',{cx:246,cy:y,r:6,fill:LAD[g]});
    const n=mkEl(s,'text',{x:260,y:y-1,'font-size':10.5,'font-weight':600,fill:INK});
    n.textContent=name;
    const val=mkEl(s,'text',{x:260,y:y+13,'font-size':15,'font-weight':800,fill:g<2?INK:'#8F8E88'});
    val.textContent=v+'%';
  });
});
})();
</script>
</body>
</html>
