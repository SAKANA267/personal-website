<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mono — Dot Heat · 聊天室活跃时段</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F0EFEB;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);padding:40px;-webkit-font-smoothing:antialiased}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:760px;margin:0 auto}
  .card{background:var(--bg);border-radius:24px;padding:28px 28px 20px}
  .card.wide{grid-column:1/-1}
  h2{font-weight:700;font-size:16.5px;letter-spacing:-.02em;margin-bottom:3px}
  .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px}
  .src{font-size:9.5px;color:var(--faint);margin-top:10px;letter-spacing:.08em;font-weight:500}
  svg{width:100%;max-height:330px;display:block;margin:0 auto}
  svg text{font-family:'Inter',sans-serif}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1.3) both}
  @keyframes pop{from{transform:scale(0)}to{transform:none}}
  .fade{animation:fade .9s ease both}
  @keyframes fade{from{opacity:0}}
  @media (prefers-reduced-motion:reduce){
    .pop,.fade{animation:none}
  }
</style>
</head>
<body>
<div class="grid2">
  <div class="card wide">
    <h2>聊天室的声音，工作日午后最响</h2>
    <div class="sub">7 天 × 12 小时（8–20 点）· 点面积 = 消息量 · 最热格标数 · 沉默也可见（演示）</div>
    <svg id="ch" viewBox="0 0 400 320" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="src">DOT HEAT · MONO-BASIC · 在线聊天 · 演示数据</div>
  </div>
</div>
<script>
// ── shared Mono tokens（与 basics-gallery 同源） ──
const INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',GRID='#DEDDD6';
const NS='http://www.w3.org/2000/svg';
const el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};
const txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};
const tip=(n,s)=>{const t=document.createElementNS(NS,'title');t.textContent=s;n.appendChild(t)};
const rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000;
const obsReveal=(id,fn)=>{
  const n=document.getElementById(id);
  const go=()=>{n.innerHTML='';fn(n)};
  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){go();io.disconnect()}},{threshold:.3});
  io.observe(n);
  n.style.cursor='pointer';
  n.addEventListener('click',go);
  // 兜底：个别嵌入式 webview 不派发 iframe 内的 IntersectionObserver 回调
  // （spec 要求初次 observe 必回调；探针 500ms 内无回调即视为该环境 IO 失效，直接渲染）
  let ioWorks=false;
  const probe=new IntersectionObserver(()=>{ioWorks=true;probe.disconnect()},{threshold:0});
  probe.observe(document.body);
  setTimeout(()=>{if(!ioWorks&&!n.children.length){io.disconnect();go()}},500);
};

// ── 数据（星期×小时；演示序列由确定性公式生成，刷新不变） ──
const DAY=['周一','周二','周三','周四','周五','周六','周日'];

// ── 渲染（骨架来自 basics-gallery「C6 · dot heat」卡） ──
obsReveal('ch',s=>{
  const x0=j=>64+j*27,y0=i=>58+i*30;
  let max=0,mi=0,mj=0;
  const v=(i,j)=>{
    const day=i<5?1:.32;                       // weekends quiet
    const hour=Math.exp(-((j-4.6)**2)/7)+.7*Math.exp(-((j-8.4)**2)/5); // two peaks
    const raw=day*hour*22*(0.6+rnd(i*12+j+1,j+3)*.8);
    return Math.round(raw);
  };
  for(let i=0;i<7;i++)for(let j=0;j<12;j++){const t=v(i,j);if(t>max){max=t;mi=i;mj=j}}
  for(let i=0;i<7;i++){
    txt(s,{x:50,y:y0(i)+3,'font-size':7.5,'font-weight':700,fill:'#6A6963','text-anchor':'end',
      'letter-spacing':'.08em',class:'fade',style:`animation-delay:${i*.05}s`},DAY[i]);
    for(let j=0;j<12;j++){
      const t=v(i,j),x=x0(j),y=y0(i);
      if(!t){el(s,'circle',{cx:x,cy:y,r:.8,fill:'#D8D6CE',
        class:'pop',style:`animation-delay:${i*.05+j*.015}s`});continue}
      const hero=i===mi&&j===mj;
      const dot=el(s,'circle',{cx:x,cy:y,r:1.2+Math.sqrt(t)*2.1,
        fill:t>max*.66?INK:t>max*.33?'#6A6963':'#B0AFA9',
        class:'pop',style:`animation-delay:${i*.05+j*.015}s`});
      tip(dot,`${DAY[i]} ${8+j}:00 — ${t} 条消息`);
      if(hero)el(s,'circle',{cx:x,cy:y,r:1.2+Math.sqrt(t)*2.1+3.4,fill:'none',
        stroke:INK,'stroke-width':1,'stroke-dasharray':'2 3',
        class:'fade',style:'animation-delay:1s'});
    }
  }
  for(let j=0;j<12;j+=2)
    txt(s,{x:x0(j),y:y0(6)+26,'font-size':7,'font-weight':600,fill:'#C6C5BF','text-anchor':'middle',
      class:'fade',style:`animation-delay:${j*.02}s`},(8+j)+':00');
  txt(s,{x:200,y:306,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',
    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1.1s'},
    `点面积 = 消息量 · 虚线圈 = 峰值 ${max} 条 · 微点 = 安静的时段`);
});
</script>
</body>
</html>
